name: afia_patient
description: "Afia patient app — describe your symptoms before attending, at home."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_ai: ^3.15.0
  google_fonts: ^8.1.0
  lucide_icons: ^0.257.0
  speech_to_text: ^7.4.0
  record: ^6.2.1
  audioplayers: ^6.7.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
